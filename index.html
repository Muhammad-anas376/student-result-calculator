    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body{
            background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .card{
            border:none;
            border-radius:20px;
            box-shadow:0 15px 40px rgba(0,0,0,.3);
        }

        .card-header{
            background:#25c0c5;
            color:#fff;
            text-align:center;
            font-size:28px;
            font-weight:bold;
            border-radius:20px 20px 0 0 !important;
        }

        .btn-custom{
            width:100%;
            font-size:18px;
        }

        #result{
            display:none;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-7">

            <div class="card">

                <div class="card-header">
                    <i class="bi bi-mortarboard-fill"></i>
                    Student Result System
                </div>

                <div class="card-body">

                    <form id="resultForm">

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Student Name</label>
                                <input type="text" id="name" class="form-control" placeholder="Enter Name" required>
                            </div>

                            <div class="col-md-6 mb-3" >
                                <label class="form-label">Father's Name</label>
                                <input type="text" id="father" class="form-control" placeholder="Enter Father's Name" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Roll Number</label>
                                <input type="text" id="roll" class="form-control" placeholder="Enter Roll No" required>
                            </div>

                            <div class="col-md-6 mb-3" >
                                <label class="form-label">Section</label>
                                <input type="text" id="section" class="form-control" placeholder="Enter Section" required>
                            </div>

                        </div>

                        <div class="mb-3">
                            <label class="form-label">Class</label>
                            <input type="text" id="class" class="form-control" placeholder="BSCS / BBA / ICS" required>
                        </div>

                        <div class="row">

                            <div class="col-md-4 mb-3">
                                <label>English</label>
                                <input type="number" id="eng" class="form-control" min="0" max="100" required>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label>Math</label>
                                <input type="number" id="math" class="form-control" min="0" max="100" required>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label>Computer</label>
                                <input type="number" id="comp" class="form-control" min="0" max="100" required>
                            </div>

                        </div>

                        <div class="d-grid gap-2">

                            <button type="button" class="btn btn-primary btn-custom">
                                <i class="bi bi-calculator"></i>
                                Calculate Result
                            </button>

                            <button type="reset" class="btn btn-outline-danger btn-custom">
                                Reset
                            </button>

                        </div>

                    </form>

                    <div class="mt-4" id="result">

                        <div class="alert alert-success">

                            <h4 class="text-center">Result Card</h4>
                            <hr>

                            <p><strong>Name:</strong> <span id="rName"></span></p>

                            <p><strong>Father's Name:</strong> <span id="rFather"></span></p>

                            <p><strong>Section:</strong> <span id="rSection"></span></p>

                            <p><strong>Class:</strong> <span id="rClass"></span></p>

                            <p><strong>Roll No:</strong> <span id="rRoll"></span></p>

                            <p><strong>Total:</strong> <span id="rTotal"></span></p>

                            <p><strong>Percentage:</strong> <span id="rPercentage"></span></p>

                            <p><strong>Grade:</strong> <span id="rGrade"></span></p>

                            <p><strong>Status:</strong> <span id="rStatus"></span></p>

                        </div>

                    </div>

                </div>

            </div>

        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
        
    
</body>
</html>
